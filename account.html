<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width-device-width, initial-scale=1.0" />
	<title>Hoopify - Account</title>
	<link rel="stylesheet" href="style.css" />
	<link rel="preconnect" href="https://fonts.gstatic.com" />
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>

<body>
	<!--header-->
	<div id="header"></div>

	<!--account page-->
	<div class="account-page">
		<div class="overlay">
			<div class="overlay-background"></div>
			<p>
				The account section of the website is being worked on and is coming soon. However, this will have no effect on your orders, and a receipt will be given on checkout. If you need to contact us, please do so through our contact page
			</p>
		</div>
		<div class="container">
			<div class="row">
				<div class="col-2">
					<img src="images/image1.png" width="100%" />
				</div>
				<div class="col-2">
					<div class="form-container">
						<div class="form-btn">
							<span onclick="login()">Login</span>
							<span onclick="register()">Register</span>
							<hr id="Indicator" />
						</div>
						<form id="LoginForm">
							<input type="text" placeholder="Username" />
							<input type="password" placeholder="Password" />
							<button type="submit" class="btn">Login</button>
							<a href="">Forgot password</a>
						</form>

						<form id="RegForm">
							<input type="email" placeholder="Email" />
							<input type="text" placeholder="Username" />
							<input type="password" placeholder="Password" />
							<button type="submit" class="btn">Register</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!--footer-->
	<div id="footer"></div>

	<!--js to load and upate header and footer-->
	<script>
		async function loadContent() {
			const header = await fetch("header.html").then((response) =>
				response.text(),
			);
			document.getElementById("header").innerHTML = header;

			const footer = await fetch("footer.html").then((response) =>
				response.text(),
			);
			document.getElementById("footer").innerHTML = footer;
		}

		loadContent();
	</script>

	<!--js for toggle menu-->
	<script>
		var menuItems = document.getElementById("MenuItems");

		MenuItems.style.maxHeight = "0px";
		function menutoggle() {
			if (MenuItems.style.maxHeight == "0px") {
				MenuItems.style.maxHeight = "200px";
			} else {
				MenuItems.style.maxHeight = "0px";
			}
		}
	</script>

	<script>
		var LoginForm = document.getElementById("LoginForm");
		var RegForm = document.getElementById("RegForm");
		var Indicator = document.getElementById("Indicator");

		function register() {
			RegForm.style.transform = "translateX(0px)";
			LoginForm.style.transform = "translateX(0px)";
			Indicator.style.transform = "translateX(100px)";
		}
		function login() {
			RegForm.style.transform = "translateX(300px)";
			LoginForm.style.transform = "translateX(300px)";
			Indicator.style.transform = "translateX(0px)";
		}
	</script>

	<script type="module">
		import {initializeCart} from "./cart.js";

		async function loadContent() {
			const headerResponse = await fetch("header.html");
			const headerHtml = await headerResponse.text();
			document.getElementById("header").innerHTML = headerHtml;

			const footerResponse = await fetch("footer.html");
			const footerHtml = await footerResponse.text();
			document.getElementById("footer").innerHTML = footerHtml;

			const menuToggle = document.getElementById("menu-toggle");
			const nav = document.querySelector("nav");

			if (menuToggle && nav) {
				menuToggle.addEventListener("click", () => {
					if (nav.style.display === "block") {
						nav.style.display = "none";
					} else {
						nav.style.display = "block";
					}
				});
			}

			initializeCart();
		}

		loadContent();
	</script>

	<script>
		var MenuItems = document.getElementById("MenuItems");

		MenuItems.style.maxHeight = "0px";
		function menutoggle() {
			if (MenuItems.style.maxHeight == "0px") {
				MenuItems.style.maxHeight = "200px";
			} else {
				MenuItems.style.maxHeight = "0px";
			}
		}
	</script>

	<script type="module" src="cart-page.js"></script>
</body>

</html>
