<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoopify - Cart</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>

  <body>
    <!--header-->
    <div id="header"></div>

    <!--cart items, table and checkout button-->
    <div class="small-container cart-page">
      <h2>Your Cart</h2>
      <div id="cartItems"></div>

      <div class="total-price">
        <div class="left-side">
          <table>
            <tr>
              <td>Subtotal</td>
              <td id="subtotal">$0.00</td>
            </tr>
            <tr>
              <td>Affiliate Discount</td>
              <td id="affiliate">$0.00</td>
            </tr>
            <tr>
              <td>Total</td>
              <td id="total">$0.00</td>
            </tr>
          </table>
        </div>

        <div class="right-side">
          <h3>Affiliate Link</h3>
          <input
            type="text"
            id="affiliate-link"
            placeholder="Enter affiliate link"
          />
          <button id="submit-link">Submit</button>
        </div>
      </div>
      <div class="button-container">
        <button class="btn" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>

    <!--footer-->
    <div id="footer"></div>

    <!--load header and footer-->
    <script type="module">
      import { initializeCart } from "./cart.js";

      async function loadContent() {
        const headerResponse = await fetch("header.html");
        const headerHtml = await headerResponse.text();
        document.getElementById("header").innerHTML = headerHtml;

        const footerResponse = await fetch("footer.html");
        const footerHtml = await footerResponse.text();
        document.getElementById("footer").innerHTML = footerHtml;

        initializeCart();
      }

      loadContent();
    </script>

    <script>
      var MenuItems = document.getElementById("MenuItems");

      MenuItems.style.maxHeight = "0px";
      function menutoggle() {
        if (MenuItems.style.maxHeight == "0px") {
          MenuItems.style.maxHeight = "200px";
        } else {
          MenuItems.style.maxHeight = "0px";
        }
      }
    </script>

    <script type="module" src="cart-page.js"></script>
  </body>
</html>
