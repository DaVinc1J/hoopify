<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoopify</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>

  <body>
    <!-- Navbar -->
    <div id="header"></div>

    <!-- Cart Items Details -->
    <div class="small-container cart-page">
      <h2>Your Cart</h2>
      <div id="cartItems">
        <div class="cart-info">
          <img src="${item.img}" alt="${item.name}" />
          <div>
            <p>${item.name}</p>
            <p>Size: ${item.size}</p>
            <small>Price: $${item.price.toFixed(2)}</small><br />
            <a
              href="#"
              class="remove-btn"
              data-id="${item.id}"
              data-size="${item.size}"
              >Remove</a
            >
          </div>
        </div>
        <div class="quantity">
          <input
            type="number"
            min="1"
            value="${item.quantity}"
            data-id="${item.id}"
            data-size="${item.size}"
          />
        </div>
        <div class="subtotal">$${itemTotal.toFixed(2)}</div>
      </div>

      <div class="total-price">
        <table>
          <tr>
            <td>Subtotal</td>
            <td id="subtotal">$0.00</td>
          </tr>
          <tr>
            <td>Affiliate Discount</td>
            <td id="affiliate">$0.00</td>
          </tr>
          <tr>
            <td>Total</td>
            <td id="total">$0.00</td>
          </tr>
        </table>
        <button class="btn" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <!--load header and footer-->
    <script>
      async function loadContent() {
        const header = await fetch("header.html").then((response) =>
          response.text(),
        );
        document.getElementById("header").innerHTML = header;

        const footer = await fetch("footer.html").then((response) =>
          response.text(),
        );
        document.getElementById("footer").innerHTML = footer;
      }

      loadContent();
    </script>

    <!-- Include the JavaScript files -->
    <script type="module" src="cart-page.js"></script>
    <script>
      var MenuItems = document.getElementById("MenuItems");

      MenuItems.style.maxHeight = "0px";
      function menutoggle() {
        if (MenuItems.style.maxHeight == "0px") {
          MenuItems.style.maxHeight = "200px";
        } else {
          MenuItems.style.maxHeight = "0px";
        }
      }
    </script>
  </body>
</html>
