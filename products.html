<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - Redstore</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>

  <body>
    <div id="header"></div>

    <!------------------------------ Products------------------------------>
    <div class="small-container">
      <div class="row row-2">
        <h2>All Products</h2>
        <select id="sort-options">
          <option value="default">Default sorting</option>
          <option value="price-asc">Sort by price: Low to High</option>
          <option value="price-desc">Sort by price: High to Low</option>
          <option value="rating-desc">Sort by rating</option>
        </select>
      </div>

      <!-- Dynamic Products Section -->
      <div class="row" id="all-products">
        <!-- Products will be dynamically inserted here -->
      </div>

      <!-- Pagination Buttons -->
      <div class="page-btn" id="pagination">
        <!-- Pagination buttons will be dynamically inserted -->
      </div>
    </div>

    <!----------------------------------footer------------------------------------->
    <div id="footer"></div>

    <!--load header and footer-->
    <script>
      async function loadContent() {
        const header = await fetch("header.html").then((response) =>
          response.text(),
        );
        document.getElementById("header").innerHTML = header;

        const footer = await fetch("footer.html").then((response) =>
          response.text(),
        );
        document.getElementById("footer").innerHTML = footer;
      }

      loadContent();
    </script>

    <!----------------------------------- JavaScript ----------------------------------------------->
    <script src="products.js" type="module"></script>

    <script src="cart.js" type="module"></script>
  </body>
</html>
